<section class="hero">
  <div class="overlay">
    <div class="hero-content">
      <h1>{{ title() }}</h1>
      <img src="/assets/logo-negro.png" alt="Logo ITBA" class="hero-logo">
      <button type="button" (click)="infoSection.scrollIntoView({ behavior: 'smooth', block: 'start' })">Conocé más</button>
    </div>
    <div class="timer-content">
      <app-countdown></app-countdown>
    </div>
  </div>
</section>

<section class="info" id="info-section" #infoSection>
  <h2>Sobre el proyecto</h2>
  <p>
    Descripcion del proyecto.
  </p>
</section>

<section class="vision-banner">
  <div class="vision-content">
    <h2>
      Hacé que el rover llegue más lejos. Apoyá el talento universitario y sé parte de esta misión.
    </h2>

    <button class="donate-btn" type="button">Contactanos</button>
  </div>
</section>

<section class="robot-features">
  <h2>Nuestras Áreas</h2>

  <app-carousel [items]="features()"></app-carousel>
</section>

<app-footer></app-footer>
