<p-carousel
  [value]="items()"
  [numVisible]="3"
  [numScroll]="1"
  [responsiveOptions]="responsiveOptions"
  [circular]="true"
  [autoplayInterval]="3500">

  <ng-template let-item pTemplate="item">
    <div
      class="area-card group"
      (click)="scrollToArea(item.id)"
      role="button"
      tabindex="0"
      [attr.aria-label]="'Ir a la sección de ' + item.title"
      (keydown.enter)="scrollToArea(item.id)"
      (keydown.space)="$event.preventDefault(); scrollToArea(item.id)">

      <div class="card-header">
        <h3 class="area-title">{{ item.title }}</h3>
      </div>

    </div>
  </ng-template>
</p-carousel>
